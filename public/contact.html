<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green: #3B6D11;
      --border: rgba(0,0,0,0.12);
      --text-sub: #5F5E5A;
      --text-hint: #888780;
      --serif: 'Noto Serif JP', serif;
      --sans: 'Noto Sans JP', sans-serif;
    }
    body { font-family: var(--sans); color: #2C2C2A; background: #FAFAF8; }
    .wrap { max-width: 900px; margin: 0 auto; min-height: 100vh; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; border-bottom: 0.5px solid var(--border); }
    .logo { font-family: var(--serif); font-size: 18px; letter-spacing: 0.15em; text-decoration: none; color: inherit; }
    .logo span { font-size: 13px; font-weight: 300; color: var(--text-sub); }
    .nav-links { display: flex; gap: 2rem; font-size: 13px; color: var(--text-sub); letter-spacing: 0.1em; }
    .nav-links a { text-decoration: none; color: inherit; }
    .header { padding: 3rem 2rem 2rem; border-bottom: 0.5px solid var(--border); }
    .header-label { font-size: 11px; letter-spacing: 0.2em; color: var(--text-hint); margin-bottom: 1rem; }
    .header h1 { font-family: var(--serif); font-size: 26px; font-weight: 400; letter-spacing: 0.08em; }
    .form-wrap { padding: 3rem 2rem 4rem; max-width: 600px; }
    .field { margin-bottom: 2rem; }
    label { display: block; font-size: 12px; letter-spacing: 0.1em; color: var(--text-sub); margin-bottom: 0.5rem; }
    .required { color: var(--green); }
    input, select, textarea {
      width: 100%; padding: 0.8rem 1rem; font-size: 14px;
      border: 0.5px solid var(--border); background: transparent;
      font-family: var(--sans); letter-spacing: 0.05em; outline: none;
    }
    textarea { resize: vertical; }
    button {
      padding: 0.9rem 3rem; font-size: 13px; letter-spacing: 0.15em;
      border: 0.5px solid #2C2C2A; background: transparent;
      font-family: var(--sans); cursor: pointer; color: #2C2C2A;
    }
    button:hover { background: #2C2C2A; color: #FAFAF8; }
    footer { padding: 1.5rem 2rem; border-top: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .footer-logo { font-family: var(--serif); font-size: 13px; letter-spacing: 0.15em; }
    .footer-copy { font-size: 11px; color: var(--text-hint); }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="/" class="logo">御社名 <span>Company Name</span></a>
      <div class="nav-links">
        <a href="#">事業内容</a>
        <a href="#">会社概要</a>
        <a href="#">お知らせ</a>
        <a href="/contact.html">お問い合わせ</a>
      </div>
    </nav>

    <div class="header">
      <div class="header-label">CONTACT</div>
      <h1>お問い合わせ</h1>
    </div>

    <div class="form-wrap">
        <form action="https://formspree.io/f/mbdezazk" method="POST">
            <!-- <input type="hidden" name="form-name" value="contact" /> -->

        <div class="field">
          <label>お名前 <span class="required">*</span></label>
          <input type="text" name="name" required />
        </div>

        <div class="field">
          <label>メールアドレス <span class="required">*</span></label>
          <input type="email" name="email" required />
        </div>

        <div class="field">
          <label>お問い合わせ種別</label>
          <select name="type">
            <option value="サービスについて">サービスについて</option>
            <option value="お見積もり">お見積もり</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="field">
          <label>お問い合わせ内容 <span class="required">*</span></label>
          <textarea name="message" rows="6" required></textarea>
        </div>

        <button type="submit">送信する</button>
      </form>
    </div>

    <footer>
      <div class="footer-logo">御社名</div>
      <div class="footer-copy">© 2026 Company Name. All rights reserved.</div>
    </footer>
  </div>
</body>
</html>
