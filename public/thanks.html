<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送信完了</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans JP', sans-serif; color: #2C2C2A; background: #FAFAF8; }
    .wrap { max-width: 900px; margin: 0 auto; min-height: 100vh; }
    nav { display: flex; padding: 1.2rem 2rem; border-bottom: 0.5px solid rgba(0,0,0,0.12); }
    .logo { font-family: 'Noto Serif JP', serif; font-size: 18px; letter-spacing: 0.15em; text-decoration: none; color: inherit; }
    .center { padding: 5rem 2rem; text-align: center; }
    .label { font-size: 11px; letter-spacing: 0.2em; color: #888780; margin-bottom: 1.5rem; }
    h1 { font-family: 'Noto Serif JP', serif; font-size: 26px; font-weight: 400; letter-spacing: 0.08em; margin-bottom: 1.5rem; }
    p { font-size: 13px; color: #5F5E5A; line-height: 2; margin-bottom: 3rem; }
    a { font-size: 13px; color: #3B6D11; letter-spacing: 0.1em; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav><a href="/" class="logo">御社名</a></nav>
    <div class="center">
      <div class="label">THANK YOU</div>
      <h1>お問い合わせありがとうございます</h1>
      <p>内容を確認の上、担当者よりご連絡いたします。<br>しばらくお待ちください。</p>
      <a href="/">← トップページに戻る</a>
    </div>
  </div>
</body>
</html>
